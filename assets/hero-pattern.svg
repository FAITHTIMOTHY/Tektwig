<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100%" viewBox="0 0 100 100">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 171, 236, 0.04)" stroke-width="1"/>
      <circle cx="40" cy="0" r="1.5" fill="rgba(0, 171, 236, 0.08)"/>
      <circle cx="0" cy="40" r="1.5" fill="rgba(0, 171, 236, 0.08)"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.7" fill="rgba(0, 171, 236, 0.05)" />
